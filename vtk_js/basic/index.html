<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101a2b">
    <title>VTK.js Cone Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        background: #101a2b;
        color: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
      }

      .demo {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100vh;
      }

      .toolbar {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem 2rem;
        padding: 1rem clamp(1rem, 4vw, 2.5rem);
        background: #101a2b;
        border-bottom: 1px solid #29364c;
      }

      .intro h1 {
        margin: 0;
        font-size: clamp(1.15rem, 3vw, 1.45rem);
        letter-spacing: 0.01em;
      }

      .intro p {
        margin: 0.35rem 0 0;
        color: #bac7d8;
        font-size: 0.9rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.25rem;
      }

      .resolution-control {
        display: grid;
        grid-template-columns: auto 2ch;
        align-items: center;
        gap: 0.25rem 0.75rem;
        min-width: min(15rem, 70vw);
      }

      .resolution-control label { font-weight: 600; }
      .resolution-control output { color: #bac7d8; text-align: right; }
      input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #ff8051; }

      button {
        min-height: 2.75rem;
        padding: 0.55rem 0.9rem;
        border: 1px solid #71819a;
        border-radius: 0.45rem;
        background: #1c2a3f;
        color: inherit;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover { background: #293a54; }
      button:focus-visible, input:focus-visible { outline: 3px solid #ffad8c; outline-offset: 3px; }

      #viewport {
        position: relative;
        min-height: 18rem;
        overflow: hidden;
        isolation: isolate;
      }

      @media (max-width: 560px) {
        .toolbar { align-items: stretch; }
        .controls { justify-content: space-between; }
        .resolution-control { flex: 1; }
        #viewport { min-height: 16rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to explore the interactive cone.</noscript>
    <main class="demo">
      <header class="toolbar">
        <div class="intro">
          <h1>VTK.js Cone</h1>
          <p>Drag to rotate. Scroll or pinch to zoom.</p>
        </div>
        <div class="controls" role="group" aria-label="Scene controls">
          <div class="resolution-control">
            <label for="resolution">Base detail</label>
            <output id="resolution-value" for="resolution">6</output>
            <input id="resolution" type="range" min="3" max="48" step="1" value="6">
          </div>
          <button id="reset-view" type="button">Reset view</button>
        </div>
      </header>
      <section id="viewport" aria-label="Interactive 3D cone view"></section>
    </main>
    <script src="dist/bundle.js" defer></script>
  </body>
</html>
